_a="/usr/bin/aria2c -UWget -c -s8 -x8 -k1M"
_a+=" --max-tries=5 --retry-wait=3 --timeout=15"
_a+=" --allow-overwrite=true --no-conf"
_a+=" --follow-metalink=mem --summary-interval=0"
_a+=" --console-log-level=warn"

DLAGENTS=(
  'file::/usr/bin/curl -gqC - -o %o %u'
  "ftp::$_a %u -o %o"
  "http::$_a %u -o %o"
  "https::$_a %u -o %o"
  'rsync::/usr/bin/rsync --no-motd -z %u %o'
  'scp::/usr/bin/scp -C %u %o'
)
